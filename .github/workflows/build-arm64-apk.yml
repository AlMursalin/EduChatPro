name: Build ARM64 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EduChatPro_v1.2.3_ARM64_Source.zip'
      - '.github/workflows/build-arm64-apk.yml'
      - 'v124-patch.js'
      - 'v125_apply.py'
      - 'v126_apply.py'
      - 'v127_apply.py'
      - 'v128_apply.py'
      - 'v129_apply.py'
      - 'v131-photos.js'
      - 'v131-runtime.js'
      - 'v131_apply.py'
      - 'v130_client_apply.py'
      - 'v141_group_poll_call_migration.sql'
      - 'v150-cache.js'
      - 'v150-runtime.js'
      - 'v150_apply.py'
      - 'v152-runtime.js'
      - 'v152_apply.py'
      - 'v152_poll_permission_migration.sql'
      - 'v156_apply.py'
      - 'v156-runtime.js'
      - 'v155-runtime.js'
      - 'v154-runtime.js'
      - 'v153-runtime.js'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -e
          if [ -f EduChatPro_v1.2.3_ARM64_Source.zip ]; then
            rm -rf appsrc
            mkdir appsrc
            unzip -q EduChatPro_v1.2.3_ARM64_Source.zip -d appsrc
            SRC="$(find appsrc -maxdepth 2 -name pubspec.yaml -printf '%h\n' | head -n1)"
            if [ -z "$SRC" ]; then
              echo "pubspec.yaml not found inside source ZIP"
              exit 1
            fi
            echo "APP_DIR=$SRC" >> "$GITHUB_ENV"
          elif [ -f pubspec.yaml ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "No Flutter source found. Upload EduChatPro_v1.2.3_ARM64_Source.zip to repository root."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove local Windows Java override
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' android/gradle.properties
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Apply v1.2.5 base patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v125_apply.py"

      - name: Apply v1.2.6 source patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v126_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js
          node --check assets/webapp/educhat-r4.js
          node --check assets/webapp/app.js
          node --check assets/webapp/app-web118.js

      - name: Apply v1.2.7 fix
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v127_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.2.8 client hardening
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v128_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.2.9 UX hardening
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v129_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.3.0 group controls
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v130_client_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.4.3 mobile screen share polls group call cache navigation forum and link fix
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v131_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/v131-runtime.js
          node --check assets/webapp/v131-photos.js
          grep -q "v1.3.8 back" assets/webapp/v131-runtime.js
          grep -q "ecp-photo-v138" assets/webapp/v131-photos.js
          grep -q "v138-comment-composer" assets/webapp/v131-runtime.js
          grep -q "Texting or calling is not allowed in this group" assets/webapp/v131-runtime.js
          grep -q "ecp-clickable-link" assets/webapp/v131-runtime.js
          grep -q "v141-polls" assets/webapp/v131-runtime.js
          grep -q "group_polls" assets/webapp/v131-runtime.js
          grep -q "v141 mobile screen-share cleanup" lib/features/meetings/meeting_room_page.dart
          grep -q "FOREGROUND_SERVICE_MEDIA_PROJECTION" android/app/src/main/AndroidManifest.xml
          grep -q "Group calling is disabled for members" "$GITHUB_WORKSPACE/v130_client_apply.py"
          grep -q "ecp_guard_group_call_create" "$GITHUB_WORKSPACE/v141_group_poll_call_migration.sql"
          node --check assets/webapp/native-mobile-patch.js

      - name: Inspect meeting chat handler
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/features/meetings/meeting_room_page.dart')
          s=p.read_text()
          i=s.find('meetingChat')
          print(s[max(0,i-5000):i+9000])
          PY

      - name: Apply v1.5.0 actual-source final patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v150_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/v150-cache.js
          node --check assets/webapp/v150-runtime.js
          grep -q 'ecp-chat-v150' assets/webapp/index.html
          grep -q 'data-comment-id' assets/webapp/index.html
          grep -q 'v150-cache.js' assets/webapp/index.html
          grep -q 'v150-runtime.js' assets/webapp/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/webapp/index.html').read_text()
          assert s.index('native-mobile-patch.js') < s.index('v150-runtime.js'), 'final runtime must load after native patch'
          assert 'v131-runtime.js' not in s, 'old runtime still loaded'
          assert 'ecp-chat-v150' in s
          print('v1.5.0 source markers verified')
          PY


      - name: Apply v1.5.2 Poll attachment and exact Android Back patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v152_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/v152-runtime.js
          grep -q 'version: 1.5.2+52' pubspec.yaml
          grep -q 'v152-runtime.js' assets/webapp/index.html
          grep -q 'data-ecp152-attach="poll"' assets/webapp/v152-runtime.js
          grep -q 'Poll creation is not allowed while member messaging is disabled.' assets/webapp/v152-runtime.js
          grep -Fq "if(['saved','notifications','meetings'].includes(current))return go('chats')" assets/webapp/v152-runtime.js
          grep -Fq "if(['chats','groups','people'].includes(current))return go('forum')" assets/webapp/v152-runtime.js
          grep -q 'const returnToChats=!!(S.group||S.direct);' assets/webapp/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/webapp/index.html').read_text()
          assert 'v151-runtime.js' not in s, 'v1.5.1 must not be included'
          assert s.index('v150-runtime.js') < s.index('v152-runtime.js')
          r=Path('assets/webapp/v150-runtime.js').read_text()
          assert 'installGroupToggle();loadPolls();enhanceComments();' not in r
          print('v1.5.2 targeted source markers verified')
          PY

      - name: Apply v1.5.6 uploaded-app fixes
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v156_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/v152-runtime.js
          node --check assets/webapp/v153-runtime.js
          node --check assets/webapp/v154-runtime.js
          node --check assets/webapp/v155-runtime.js
          node --check assets/webapp/v156-runtime.js
          python - <<'PY'
          from pathlib import Path
          checks={
            'version': 'version: 1.5.6+56' in Path('pubspec.yaml').read_text(),
            'runtime-tag': 'v156-runtime.js' in Path('assets/webapp/index.html').read_text(),
            'poll-button': 'ecp156-poll-button' in Path('assets/webapp/v156-runtime.js').read_text(),
            'group-setting': 'Allow member messaging and calling' in Path('assets/webapp/index.html').read_text(),
            'group-rpc': 'set_group_member_permissions' in Path('assets/webapp/index.html').read_text(),
            'forum-cache': 'ecp-forum-cache' in Path('assets/webapp/index.html').read_text(),
            'poll-export': 'window.EduPollUI' in Path('assets/webapp/v152-runtime.js').read_text(),
            'back-history': 'v1.5.6 back' in Path('assets/webapp/v156-runtime.js').read_text(),
          }
          print(checks)
          missing=[k for k,v in checks.items() if not v]
          if missing: raise SystemExit('Missing v1.5.6 markers: '+', '.join(missing))
          PY

      - name: Package reconstructed v1.5.6 source
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          zip -qr /tmp/EduChatPro-v1.5.6-reconstructed-source.zip . -x 'build/*' '.dart_tool/*'

      - name: Upload reconstructed v1.5.6 source
        uses: actions/upload-artifact@v4
        with:
          name: EduChatPro-v1.5.6-reconstructed-source
          path: /tmp/EduChatPro-v1.5.6-reconstructed-source.zip
          if-no-files-found: error

      - name: Clean previous Flutter build
        working-directory: ${{ env.APP_DIR }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify final APK bundled runtime
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          rm -rf /tmp/ecp-apk && mkdir -p /tmp/ecp-apk
          unzip -q "$APK" -d /tmp/ecp-apk
          WEB=/tmp/ecp-apk/assets/flutter_assets/assets/webapp
          test -f "$WEB/v150-cache.js"
          test -f "$WEB/v150-runtime.js"
          test -f "$WEB/v152-runtime.js"
          test -f "$WEB/v153-runtime.js"
          test -f "$WEB/v154-runtime.js"
          test -f "$WEB/v155-runtime.js"
          test -f "$WEB/v156-runtime.js"
          grep -q 'ecp-chat-v150' "$WEB/index.html"
          grep -q 'data-comment-id' "$WEB/index.html"
          grep -q 'v150-runtime.js' "$WEB/index.html"
          grep -q 'Member Texting & Calling' "$WEB/v150-runtime.js"
          grep -q 'ecp-facebook-comments' "$WEB/v150-runtime.js"
          grep -q 'Texting or calling is not allowed in this group' "$WEB/v150-runtime.js"
          grep -q 'Polls' "$WEB/v150-runtime.js"
          grep -q 'v152-runtime.js' "$WEB/index.html"
          grep -q 'data-ecp152-attach="poll"' "$WEB/v152-runtime.js"
          grep -q 'v1.5.2 back' "$WEB/v152-runtime.js"
          grep -q 'ecp156-poll-button' "$WEB/v156-runtime.js"
          grep -q 'Allow member messaging and calling' "$WEB/index.html"
          grep -q 'ecp-forum-cache' "$WEB/index.html"
          grep -q 'v156-runtime.js' "$WEB/index.html"
          grep -q 'const returnToChats=!!(S.group||S.direct);' "$WEB/index.html"
          echo "Final APK runtime markers verified"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: EduChatPro-v1.5.6-arm64-v8a
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
