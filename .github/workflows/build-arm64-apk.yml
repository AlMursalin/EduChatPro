name: Build ARM64 APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'EduChatPro_v1.2.3_ARM64_Source.zip'
      - '.github/workflows/build-arm64-apk.yml'
      - 'v124-patch.js'
      - 'v125_apply.py'
      - 'v126_apply.py'
      - 'v127_apply.py'
      - 'v128_apply.py'
      - 'v129_apply.py'
      - 'v131-photos.js'
      - 'v131-runtime.js'
      - 'v131_apply.py'
      - 'v130_client_apply.py'
  push:
    paths:
      - 'EduChatPro_v1.2.3_ARM64_Source.zip'
      - '.github/workflows/build-arm64-apk.yml'
      - 'v124-patch.js'
      - 'v125_apply.py'
      - 'v126_apply.py'
      - 'v127_apply.py'
      - 'v128_apply.py'
      - 'v129_apply.py'
      - 'v131-photos.js'
      - 'v131-runtime.js'
      - 'v131_apply.py'
      - 'v130_client_apply.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -e
          if [ -f EduChatPro_v1.2.3_ARM64_Source.zip ]; then
            rm -rf appsrc
            mkdir appsrc
            unzip -q EduChatPro_v1.2.3_ARM64_Source.zip -d appsrc
            SRC="$(find appsrc -maxdepth 2 -name pubspec.yaml -printf '%h\n' | head -n1)"
            if [ -z "$SRC" ]; then
              echo "pubspec.yaml not found inside source ZIP"
              exit 1
            fi
            echo "APP_DIR=$SRC" >> "$GITHUB_ENV"
          elif [ -f pubspec.yaml ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "No Flutter source found. Upload EduChatPro_v1.2.3_ARM64_Source.zip to repository root."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove local Windows Java override
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' android/gradle.properties
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Apply v1.2.5 base patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v125_apply.py"

      - name: Apply v1.2.6 source patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v126_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js
          node --check assets/webapp/educhat-r4.js
          node --check assets/webapp/app.js
          node --check assets/webapp/app-web118.js

      - name: Apply v1.2.7 fix
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v127_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.2.8 client hardening
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v128_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.2.9 UX hardening
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v129_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.3.0 group controls
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v130_client_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/native-mobile-patch.js

      - name: Apply v1.3.1 final UX and cache patch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python "$GITHUB_WORKSPACE/v131_apply.py"
          grep '^version:' pubspec.yaml
          node --check assets/webapp/v131-runtime.js
          node --check assets/webapp/v131-photos.js
          node --check assets/webapp/native-mobile-patch.js

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK validity
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          mkdir -p build/universal
          cp "$APK" build/universal/EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a.apk
          sha256sum build/universal/EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a.apk > build/universal/EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a.apk.sha256

      - name: Upload verified universal APK
        uses: actions/upload-artifact@v4
        with:
          name: EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a
          path: |
            ${{ env.APP_DIR }}/build/universal/EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a.apk
            ${{ env.APP_DIR }}/build/universal/EduChatPro-v1.3.1-UNIVERSAL-arm64-v8a.apk.sha256
          if-no-files-found: error
